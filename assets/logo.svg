<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0b0f0c"/>
  
  <!-- Ground plane / base slab fused with circuit traces -->
  <polygon points="68,196 188,196 200,212 56,212" fill="#0b0f0c" stroke="#d8e6d2" stroke-width="2"/>
  <polyline points="56,212 68,196 188,196 200,212" fill="none" stroke="#d8e6d2" stroke-width="2"/>
  
  <!-- Circuit trace details on base -->
  <line x1="76" y1="204" x2="118" y2="204" stroke="#3fd67a" stroke-width="2"/>
  <line x1="138" y1="204" x2="180" y2="204" stroke="#3fd67a" stroke-width="2"/>
  <circle cx="128" cy="204" r="3" fill="#f2a33c"/>
  
  <!-- Tower body: squat, tapered, brutalist -->
  <polygon points="108,196 120,88 136,88 148,196" fill="#d8e6d2" stroke="#d8e6d2" stroke-width="1.5"/>
  <!-- Tower cross-braces -->
  <line x1="113" y1="170" x2="143" y2="170" stroke="#0b0f0c" stroke-width="3"/>
  <line x1="115" y1="140" x2="141" y2="140" stroke="#0b0f0c" stroke-width="3"/>
  <line x1="117" y1="112" x2="139" y2="112" stroke="#0b0f0c" stroke-width="3"/>
  <!-- Diagonal braces -->
  <line x1="113" y1="170" x2="141" y2="140" stroke="#0b0f0c" stroke-width="2.5"/>
  <line x1="143" y1="170" x2="115" y2="140" stroke="#0b0f0c" stroke-width="2.5"/>
  <line x1="115" y1="140" x2="139" y2="112" stroke="#0b0f0c" stroke-width="2.5"/>
  <line x1="141" y1="140" x2="117" y2="112" stroke="#0b0f0c" stroke-width="2.5"/>
  
  <!-- Antenna tip -->
  <rect x="125" y="68" width="6" height="20" fill="#f2a33c"/>
  <polygon points="128,58 121,68 135,68" fill="#f2a33c"/>
  
  <!-- Signal arcs emitting from top - concentric, offset to upper right -->
  <path d="M140,64 Q168,40 172,68" fill="none" stroke="#3fd67a" stroke-width="3"/>
  <path d="M146,56 Q184,24 192,64" fill="none" stroke="#3fd67a" stroke-width="3"/>
  <path d="M152,48 Q200,8 212,60" fill="none" stroke="#f2a33c" stroke-width="3"/>
  
  <!-- Left side signal arcs (smaller, subversive asymmetry) -->
  <path d="M116,64 Q100,48 96,68" fill="none" stroke="#3fd67a" stroke-width="2.5"/>
  <path d="M110,56 Q90,32 84,64" fill="none" stroke="#3fd67a" stroke-width="2.5"/>
  
  <!-- Bitcoin-ish node indicator at top -->
  <circle cx="128" cy="56" r="4" fill="#f2a33c"/>
  <circle cx="128" cy="56" r="1.5" fill="#0b0f0c"/>
  
  <!-- Small data packets on arcs -->
  <rect x="186" y="38" width="5" height="5" fill="#f2a33c" transform="rotate(20 188 40)"/>
  <rect x="78" y="42" width="4" height="4" fill="#3fd67a" transform="rotate(-15 80 44)"/>
  
  <!-- Base connection traces to tower -->
  <line x1="128" y1="196" x2="128" y2="204" stroke="#d8e6d2" stroke-width="2"/>
  
  <!-- Tiny status dots along base -->
  <rect x="90" y="207" width="4" height="2" fill="#3fd67a"/>
  <rect x="98" y="207" width="4" height="2" fill="#3fd67a"/>
  <rect x="106" y="207" width="4" height="2" fill="#f2a33c"/>
  <rect x="146" y="207" width="4" height="2" fill="#3fd67a"/>
  <rect x="154" y="207" width="4" height="2" fill="#3fd67a"/>
  
  <!-- Corner registration marks (terminal-brutalist framing) -->
  <line x1="30" y1="30" x2="48" y2="30" stroke="#d8e6d2" stroke-width="1.5"/>
  <line x1="30" y1="30" x2="30" y2="48" stroke="#d8e6d2" stroke-width="1.5"/>
  <line x1="226" y1="30" x2="208" y2="30" stroke="#d8e6d2" stroke-width="1.5"/>
  <line x1="226" y1="30" x2="226" y2="48" stroke="#d8e6d2" stroke-width="1.5"/>
  <line x1="30" y1="226" x2="48" y2="226" stroke="#d8e6d2" stroke-width="1.5"/>
  <line x1="30" y1="226" x2="30" y2="208" stroke="#d8e6d2" stroke-width="1.5"/>
  <line x1="226" y1="226" x2="208" y2="226" stroke="#d8e6d2" stroke-width="1.5"/>
  <line x1="226" y1="226" x2="226" y2="208" stroke="#d8e6d2" stroke-width="1.5"/>
  
  <!-- Wordmark, small, bottom right -->
  <text x="188" y="242" font-family="monospace" font-size="7" fill="#d8e6d2" text-anchor="end" letter-spacing="1.5">BTC-TX-BROADCASTER</text>
</svg>
